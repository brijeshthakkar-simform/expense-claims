# Expense Claims — local stack (01 §11): postgres + objectstore → migrate → app.
#   cp .env.example .env && docker compose up --build --wait
# .env is used for INTERPOLATION ONLY. No service uses env_file: each lists exactly the variables it
# needs, so the app never holds owner or superuser credentials (D-34, C-11). Ports bind to 127.0.0.1.
name: expense-claims

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expense_claims}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run cp .env.example .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Run cp .env.example .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Run cp .env.example .env}
    volumes:
      - pgdata:/var/lib/postgresql # PG 18 layout, NOT /var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro # runs only on an empty volume
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    healthcheck:
      # -h 127.0.0.1: the initdb temp server listens on the unix socket only, so a TCP probe
      # cannot report healthy before 01-roles.sh has finished and the real server is up.
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Receipts object store (P6, D-30): SeaweedFS passed the storage gate, so the fs fallback of
  # 01 §11.3 is not used. Private: published on 127.0.0.1 only, SigV4 with the keys below.
  objectstore:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['mini', '-dir=/data'] # master + volume + filer + S3 (:8333) in one process
    environment: # BOTH required, else S3 runs unauthenticated
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run cp .env.example .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run cp .env.example .env}
    volumes: ['objectstore:/data']
    ports: ['127.0.0.1:${S3_HOST_PORT:-8333}:8333']
    healthcheck:
      # The S3 gateway's own /healthz (200 once it serves requests), not just an open port. The
      # image is Alpine with busybox wget; ensure-bucket still retries until a HeadBucket answers.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrate: # one-shot release job (tools image): migrate deploy → ensure-bucket → seed
    build: { context: ., target: tools }
    image: expense-claims-tools:local
    command: ['release']
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATE_DATABASE_URL: postgresql://expense_owner:${DB_OWNER_PASSWORD:?Run cp .env.example .env}@postgres:5432/${POSTGRES_DB:-expense_claims}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      RECEIPT_STORAGE_DRIVER: ${RECEIPT_STORAGE_DRIVER:-s3} # ensure-bucket is a no-op for fs
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-receipts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run cp .env.example .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run cp .env.example .env}
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_healthy } # dropped under the fs fallback (01 §11.3)
    restart: 'no'

  app:
    build:
      context: .
      target: runner
      args: { APP_VERSION: '${APP_VERSION:-dev}' }
    image: expense-claims-app:local
    environment: # NO owner URL, NO superuser or role passwords (boot exits if any is present)
      APP_ENV: ${APP_ENV:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_VERSION: ${APP_VERSION:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://expense_app:${DB_APP_PASSWORD:?Run cp .env.example .env}@postgres:5432/${POSTGRES_DB:-expense_claims}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-60}
      SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:-12}
      DEMO_MODE: ${DEMO_MODE:-false}
      RECEIPT_STORAGE_DRIVER: ${RECEIPT_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-receipts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run cp .env.example .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run cp .env.example .env}
      EXPORT_BATCH_SIZE: ${EXPORT_BATCH_SIZE:-500}
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:${APP_PORT:-3000}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    init: true # PID 1 forwards signals
    stop_grace_period: 20s # in-flight requests finish; verified in P8
    # No restart policy: a misconfigured app exits non-zero and `--wait` fails fast instead of looping.

  # k6 (OPTIONAL, profile `load`) is added with load/export.k6.js in the buffer phase (01 §11.1).

volumes:
  pgdata: {}
  objectstore: {}
